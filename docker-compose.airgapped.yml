
services:
  db-migrator:
    image: jeen-db-migrator:latest
    container_name: db-migrator
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount external .env so the app reads customer config without rebuilding
      - ./.env:/app/.env:ro
      # Persist output files
      - ./output:/app/output
      # Persist saved configurations
      - ./configs:/app/configs
      # Persist backups
      - ./backups:/app/backups
    environment:
      # Optional: Set default connection values
      # - SOURCE_HOST=your-source-db-host
      # - TARGET_HOST=your-target-db-host
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    restart: unless-stopped
    networks:
      - db-migrator-network

networks:
  db-migrator-network:
    driver: bridge
