
services:
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: jeen-db-migrator:latest
    container_name: db-migrator
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount external .env so the app reads customer config without rebuilding
      - ./.env:/app/.env:ro
      # Persist output files
      - ./output:/app/output
      # Persist saved configurations
      - ./configs:/app/configs
      # Persist backups
      - ./backups:/app/backups
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
    restart: unless-stopped
    networks:
      - db-migrator-network

networks:
  db-migrator-network:
    driver: bridge
